name: homework2

services:
  api:
    image: homework2-api:latest
    build:
      context: .
      dockerfile: src/backend/Homework2.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - homework2-data:/app/data
    restart: unless-stopped

  web:
    image: homework2-web:latest
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  homework2-data:
    name: homework2-data
